<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>IDALIC.IO — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root {
  color-scheme: dark;
  --void: #000000;
  --deep: #000000;
  --signal: #5ee7ff;
  --packet: #8b7bff;
  --ice: #e8f1ff;
  --dim: #7d8bb0;
  --alert: #ff4d6d;
  --word-bottom: 60vh;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--void);
  color: var(--ice);
  font-family: "Exo 2", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* Deep-space backdrop */
body {
  background:
    radial-gradient(ellipse 70% 50% at 50% 42%, rgba(94,231,255,0.04), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(139,123,255,0.07), transparent 70%),
    linear-gradient(to bottom, var(--void) 0%, var(--deep) 100%);
}

/* Perspective grid floor */
.floor {
  position: fixed;
  left: -50%;
  right: -50%;
  bottom: 0;
  height: 46vh;
  transform-origin: bottom center;
  transform: perspective(380px) rotateX(62deg);
  background-image:
    linear-gradient(to right, rgba(94,231,255,0.22) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(139,123,255,0.22) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
          mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
  animation: floorRun 3.2s linear infinite;
  pointer-events: none;
}

.horizon {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 13vh;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(94,231,255,0.55), rgba(139,123,255,0.55), transparent);
  box-shadow: 0 0 24px 4px rgba(94,231,255,0.18);
  pointer-events: none;
}

@keyframes floorRun {
  from { background-position: 0 0; }
  to   { background-position: 0 64px; }
}

/* Faint scanlines */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
  pointer-events: none;
  z-index: 3;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  display: block;
  touch-action: none;
}

main {
  position: relative;
  z-index: 4;
  height: 100%;
  pointer-events: none;
}

/* Wordmark stays in the DOM for search engines and screen readers;
   with JS on, the particle network draws it. */
.title {
  margin: 0;
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  font-family: "Orbitron", "Segoe UI", sans-serif;
  font-weight: 700;
  font-size: clamp(2.4rem, 10vw, 7.5rem);
  letter-spacing: 0.18em;
  padding-left: 0.18em;
  white-space: nowrap;
  color: var(--ice);
  text-shadow: 0 0 24px rgba(94,231,255,0.5);
}

.js .title {
  clip-path: inset(50%);
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.status {
  position: absolute;
  left: 50%;
  top: var(--word-bottom);
  transform: translate(-50%, 12px);
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 10px 22px 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(94,231,255,0.25);
  background: linear-gradient(135deg, rgba(94,231,255,0.08), rgba(139,123,255,0.08));
  -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 0 32px rgba(94,231,255,0.12);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--ice);
  opacity: 0;
  transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}

.status.on {
  opacity: 1;
  transform: translate(-50%, 0);
}

.no-js-visible .status,
html:not(.js) .status {
  opacity: 1;
  top: calc(46% + 5rem);
  transform: translate(-50%, 0);
}

.dot {
  position: relative;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--alert);
  box-shadow: 0 0 10px var(--alert);
}

.dot::after {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 1px solid var(--alert);
  animation: ping 1.8s ease-out infinite;
}

@keyframes ping {
  0%   { transform: scale(0.4); opacity: 0.9; }
  100% { transform: scale(1.8); opacity: 0; }
}

@media (max-width: 600px) {
  .status { font-size: 0.95rem; padding: 9px 18px 9px 15px; }
  .floor { background-size: 44px 44px; height: 40vh; }
  .horizon { bottom: 11vh; }
  @keyframes floorRun { to { background-position: 0 44px; } }
}

@media (prefers-reduced-motion: reduce) {
  .floor, .dot::after { animation: none; }
  .status { transition: none; }
}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>

<div class="floor" aria-hidden="true"></div>
<div class="horizon" aria-hidden="true"></div>
<canvas id="net" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>

<main>
  <h1 class="title">IDALIC.IO</h1>
  <div class="status" id="status">
    <span class="dot" aria-hidden="true"></span>
    <span>Em breve</span>
  </div>
</main>

<script>
(() => {
  const WORD = 'IDALIC.IO';
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CYAN = [94, 231, 255];
  const VIOLET = [139, 123, 255];

  let W = 0, H = 0, dpr = 1;
  let particles = [];
  let nodes = [];
  let wordBox = { x: 0, y: 0, w: 0, h: 0 };
  let start = 0;
  const pointer = { x: -9999, y: -9999, active: false };

  function mix(a, b, t) {
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
  }

  // Render the wordmark offscreen and sample its pixels as particle targets
  function sampleWord() {
    const off = document.createElement('canvas');
    const o = off.getContext('2d');
    off.width = W;
    off.height = H;

    let size = Math.min(W * 0.13, 150);
    const font = s => `700 ${s}px Orbitron, "Segoe UI", sans-serif`;
    const spacingRatio = 0.18;

    const measure = s => {
      o.font = font(s);
      let w = 0;
      for (const ch of WORD) w += o.measureText(ch).width + s * spacingRatio;
      return w - s * spacingRatio;
    };

    let total = measure(size);
    const maxW = W * 0.88;
    if (total > maxW) { size *= maxW / total; total = measure(size); }

    o.font = font(size);
    o.textBaseline = 'middle';
    o.fillStyle = '#fff';
    const cy = H * 0.46;
    let x = (W - total) / 2;
    for (const ch of WORD) {
      o.fillText(ch, x, cy);
      x += o.measureText(ch).width + size * spacingRatio;
    }

    wordBox = { x: (W - total) / 2, y: cy - size * 0.5, w: total, h: size };
    document.documentElement.style.setProperty('--word-bottom', `${cy + size * 0.62 + 18}px`);

    const data = o.getImageData(0, 0, W, H).data;
    let gap = Math.max(3, Math.round(size / 34));
    let pts;
    do {
      pts = [];
      for (let py = Math.floor(wordBox.y - 4); py < wordBox.y + size + 4; py += gap) {
        for (let px = Math.floor(wordBox.x - 4); px < wordBox.x + total + 4; px += gap) {
          if (px < 0 || py < 0 || px >= W || py >= H) continue;
          if (data[(py * W + px) * 4 + 3] > 128) pts.push([px, py]);
        }
      }
      gap++;
    } while (pts.length > 3600);
    return { pts, size };
  }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const { pts, size } = sampleWord();
    const dot = Math.max(1.4, size / 70);

    particles = pts.map(([tx, ty]) => {
      const t = (tx - wordBox.x) / wordBox.w;
      const ang = Math.random() * Math.PI * 2;
      const r = Math.max(W, H) * (0.4 + Math.random() * 0.6);
      return {
        x: reduce ? tx : W / 2 + Math.cos(ang) * r,
        y: reduce ? ty : H * 0.46 + Math.sin(ang) * r,
        tx, ty,
        vx: 0, vy: 0,
        t,
        s: dot * (0.75 + Math.random() * 0.5),
        color: mix(CYAN, VIOLET, t),
        delay: t * 700 + Math.random() * 500
      };
    });

    const count = W < 600 ? 28 : 60;
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25
    }));
  }

  function drawNodes() {
    const link = W < 600 ? 110 : 150;
    for (const n of nodes) {
      if (!reduce) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > W) n.vx *= -1;
        if (n.y < 0 || n.y > H) n.vy *= -1;
      }
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < link) {
          ctx.strokeStyle = `rgba(94,231,255,${(1 - d / link) * 0.18})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      if (pointer.active) {
        const d = Math.hypot(a.x - pointer.x, a.y - pointer.y);
        if (d < link * 1.4) {
          ctx.strokeStyle = `rgba(139,123,255,${(1 - d / (link * 1.4)) * 0.45})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(232,241,255,0.55)';
      ctx.fillRect(a.x - 1, a.y - 1, 2, 2);
    }
  }

  function frame(now) {
    if (!start) start = now;
    const el = now - start;
    ctx.clearRect(0, 0, W, H);
    drawNodes();

    // A light sweep crosses the wordmark every few seconds
    const period = 5200;
    const phase = ((el - 2200) % period) / period;
    const sweepX = el > 2200 && !reduce
      ? wordBox.x - 120 + phase * (wordBox.w + 240) * 1.6
      : -9999;

    const R = Math.min(110, W * 0.14);
    for (const p of particles) {
      if (!reduce && el > p.delay) {
        let ax = (p.tx - p.x) * 0.045;
        let ay = (p.ty - p.y) * 0.045;
        if (pointer.active) {
          const dx = p.x - pointer.x, dy = p.y - pointer.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < R * R) {
            const d = Math.sqrt(d2) || 1;
            const f = (1 - d / R) * 6;
            ax += (dx / d) * f;
            ay += (dy / d) * f;
          }
        }
        p.vx = (p.vx + ax) * 0.82;
        p.vy = (p.vy + ay) * 0.82;
        p.x += p.vx;
        p.y += p.vy;
      }

      const near = Math.abs(p.x - sweepX);
      if (near < 40) {
        const k = 1 - near / 40;
        ctx.fillStyle = `rgba(255,255,255,${0.6 + k * 0.4})`;
        const s = p.s * (1 + k * 0.8);
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      }
    }

    if (!reduce) requestAnimationFrame(frame);
  }

  function setPointer(x, y) { pointer.x = x; pointer.y = y; pointer.active = true; }
  window.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('pointerleave', () => { pointer.active = false; });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.active = false; });
  window.addEventListener('blur', () => { pointer.active = false; });

  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { build(); if (reduce) frame(performance.now()); }, 150);
  });

  function go() {
    build();
    requestAnimationFrame(frame);
    setTimeout(() => status.classList.add('on'), reduce ? 0 : 1500);
  }

  // Wait for Orbitron so the particles trace the right letterforms
  const fontReady = document.fonts && document.fonts.load
    ? document.fonts.load('700 100px Orbitron')
    : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(go, go);
})();
</script>
</body>
</html>
