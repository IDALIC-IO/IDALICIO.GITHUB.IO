<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>IDALIC.IO — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />

<style>
:root {
  color-scheme: dark;
  --space: #000000;
  --white: #ffffff;
  --mist: rgba(255,255,255,0.72);
  --hair: rgba(255,255,255,0.35);
  --alert: #ff3b30;
  --edge: clamp(24px, 5vw, 72px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--space);
  color: var(--white);
  font-family: "Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Cinematic gradient so the text always reads against the planet */
.shade {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,0,0,0.45), transparent 75%),
    linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 35%);
  pointer-events: none;
}

/* Black curtain that lifts on load */
.curtain {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 5;
  pointer-events: none;
  animation: lift 2.4s 0.2s ease forwards;
}
@keyframes lift { to { opacity: 0; } }

main {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding:
    calc(var(--edge) + env(safe-area-inset-top, 0px))
    var(--edge)
    calc(var(--edge) + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}

.title {
  margin: 0;
  font-family: "Orbitron", "Barlow", sans-serif;
  font-weight: 700;
  font-size: clamp(2rem, 8.6vw, 6.6rem);
  line-height: 1;
  letter-spacing: 0.18em;
  padding-left: 0.18em;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(18px);
  animation: in 1.4s 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.status {
  margin-top: clamp(20px, 3.5vh, 32px);
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 30px;
  border: 2px solid var(--white);
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(18px);
  animation: in 1.4s 1.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--alert);
  animation: blink 1.6s ease-in-out infinite;
}

@keyframes in { to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

/* Hairline progress scale along the bottom, like a mission timeline */
.scale {
  position: fixed;
  left: var(--edge);
  right: var(--edge);
  bottom: calc(clamp(24px, 5vh, 44px) + env(safe-area-inset-bottom, 0px));
  height: 9px;
  z-index: 2;
  background:
    linear-gradient(var(--hair), var(--hair)) left bottom / 100% 1px no-repeat,
    repeating-linear-gradient(to right, var(--hair) 0 1px, transparent 1px 40px) left bottom / 100% 5px no-repeat;
  opacity: 0;
  animation: fade 1.6s 2.2s ease forwards;
  pointer-events: none;
}
.scale::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  height: 1px;
  width: 0;
  background: var(--white);
  box-shadow: 0 0 8px rgba(255,255,255,0.8);
  animation: progress 6s 2.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
@keyframes fade { to { opacity: 1; } }
@keyframes progress { to { width: 68%; } }

@media (max-width: 600px) {
  .status { padding: 12px 24px; font-size: 0.85rem; }
}

@media (prefers-reduced-motion: reduce) {
  .curtain { display: none; }
  .title, .status, .scale { animation: none; opacity: 1; transform: none; }
  .scale::after { animation: none; width: 68%; }
  .dot { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<canvas id="orbit" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<main>
  <h1 class="title">IDALIC.IO</h1>
  <div class="status">
    <span class="dot" aria-hidden="true"></span>
    <span>EM BREVE</span>
  </div>
</main>

<div class="scale" aria-hidden="true"></div>
<div class="curtain" aria-hidden="true"></div>

<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('orbit');
  const ctx = canvas.getContext('2d');

  let W, H, dpr, R, ex, ey;
  let stars = [];
  let cities = [];
  let train = null;
  let nextTrain = 1500;
  let t0 = 0;

  // Seeded random so the planet looks the same on every resize
  function rng(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Huge planet whose limb arcs across the lower third
    R = Math.max(W, H) * 1.35;
    ex = W * 0.62;
    ey = H * 0.72 + R;

    const r = rng(7);
    stars = Array.from({ length: Math.round((W * H) / 2600) }, () => ({
      x: r() * W,
      y: r() * H,
      s: r() < 0.08 ? 1.6 : r() * 1.1 + 0.3,
      a: r() * 0.7 + 0.15,
      tw: r() * Math.PI * 2
    }));

    // City-light clusters on the night side, in planet coordinates (lon, lat)
    const c = rng(42);
    cities = [];
    for (let k = 0; k < 38; k++) {
      const lon = c() * Math.PI * 2;
      const lat = 0.02 + c() * 0.22;
      const n = 6 + Math.floor(c() * 30);
      for (let j = 0; j < n; j++) {
        cities.push({
          lon: lon + (c() - 0.5) * 0.05,
          lat: lat + (c() - 0.5) * 0.018,
          a: 0.25 + c() * 0.75,
          s: c() < 0.15 ? 1.6 : 1
        });
      }
    }
  }

  function drawStars(time) {
    for (const s of stars) {
      // Stars fade out near the bright limb
      const d = Math.hypot(s.x - ex, s.y - ey) - R;
      if (d < 0) continue;
      const fade = Math.min(1, d / (H * 0.25));
      const tw = reduce ? 1 : 0.75 + Math.sin(time * 0.0012 + s.tw) * 0.25;
      ctx.fillStyle = `rgba(255,255,255,${s.a * fade * tw})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }

  function drawPlanet(time) {
    // Night side body
    const body = ctx.createRadialGradient(ex + R * 0.25, ey - R * 0.9, R * 0.1, ex, ey, R);
    body.addColorStop(0, '#0d1a2e');
    body.addColorStop(0.6, '#050a14');
    body.addColorStop(1, '#020409');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(ex, ey, R, 0, Math.PI * 2);
    ctx.fill();

    // City lights rotate slowly with the planet
    ctx.save();
    ctx.beginPath();
    ctx.arc(ex, ey, R - 1, 0, Math.PI * 2);
    ctx.clip();
    const spin = reduce ? 0 : time * 0.0000035;
    for (const p of cities) {
      const lon = p.lon + spin;
      const x3 = Math.sin(lon) * Math.cos(p.lat);
      const z3 = Math.cos(lon) * Math.cos(p.lat);
      if (z3 < 0.05) continue;
      const y3 = Math.sin(p.lat);
      // Orthographic projection, viewed from above the limb
      const px = ex + x3 * R;
      const py = ey - (y3 * 0.35 + z3 * 0.94) * R * 0.999;
      if (py < 0 || py > H || px < -10 || px > W + 10) continue;
      const edgeFade = Math.min(1, z3 * 4);
      ctx.fillStyle = `rgba(255,196,120,${p.a * edgeFade * 0.85})`;
      ctx.fillRect(px, py, p.s, p.s);
    }
    ctx.restore();

    // Atmosphere: layered glow hugging the limb
    const layers = [
      { w: 2, a: 0.9, c: '160,210,255' },
      { w: 10, a: 0.35, c: '90,160,255' },
      { w: 34, a: 0.14, c: '60,120,255' },
      { w: 90, a: 0.06, c: '40,90,220' }
    ];
    for (const L of layers) {
      const g = ctx.createRadialGradient(ex, ey, R - L.w * 0.3, ex, ey, R + L.w);
      g.addColorStop(0, `rgba(${L.c},0)`);
      g.addColorStop(0.35, `rgba(${L.c},${L.a})`);
      g.addColorStop(1, `rgba(${L.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(ex, ey, R + L.w, 0, Math.PI * 2);
      ctx.fill();
    }

    // Daylight scattering along the limb near the sun
    {
      const lx = W * 0.86;
      const ly = ey - Math.sqrt(Math.max(0, R * R - (lx - ex) * (lx - ex)));
      const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.45);
      glow.addColorStop(0, 'rgba(120,180,255,0.35)');
      glow.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.save();
      ctx.beginPath();
      ctx.arc(ex, ey, R + 14, 0, Math.PI * 2);
      ctx.arc(ex, ey, R - 6, 0, Math.PI * 2, true);
      ctx.clip();
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Sunrise on the limb
    const sx = W * 0.86;
    const dy = Math.sqrt(Math.max(0, R * R - (sx - ex) * (sx - ex)));
    const sy = ey - dy;
    const pulse = reduce ? 1 : 0.92 + Math.sin(time * 0.0006) * 0.08;
    const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.min(W, H) * 0.55);
    sun.addColorStop(0, `rgba(255,255,255,${pulse})`);
    sun.addColorStop(0.03, `rgba(255,250,235,${0.9 * pulse})`);
    sun.addColorStop(0.09, `rgba(255,220,170,${0.35 * pulse})`);
    sun.addColorStop(0.3, `rgba(110,170,255,${0.14 * pulse})`);
    sun.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, W, H);

    // Thin flare streak along the horizon
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(Math.atan2(sy - ey, sx - ex) + Math.PI / 2);
    const fl = W * 0.22;
    const flare = ctx.createLinearGradient(-fl, 0, fl, 0);
    flare.addColorStop(0, 'rgba(255,255,255,0)');
    flare.addColorStop(0.5, `rgba(255,255,255,${0.7 * pulse})`);
    flare.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = flare;
    ctx.fillRect(-fl, -0.75, fl * 2, 1.5);
    ctx.restore();
  }

  // A train of satellites crossing the sky, catching sunlight
  function spawnTrain() {
    const fromLeft = Math.random() < 0.5;
    const y = H * (0.12 + Math.random() * 0.25);
    train = {
      x: fromLeft ? -W * 0.4 : W * 1.4,
      y,
      vx: (fromLeft ? 1 : -1) * W * 0.00009,
      vy: H * 0.000012 * (Math.random() - 0.3),
      n: 22 + Math.floor(Math.random() * 12),
      gap: Math.max(12, W * 0.012),
      angle: (Math.random() - 0.5) * 0.25
    };
  }

  function drawTrain(dt) {
    if (!train) return;
    train.x += train.vx * dt;
    train.y += train.vy * dt;
    const dir = Math.sign(train.vx);
    for (let i = 0; i < train.n; i++) {
      const px = train.x - dir * i * train.gap * Math.cos(train.angle);
      const py = train.y - i * train.gap * Math.sin(train.angle);
      const a = 0.85 * (1 - i / train.n * 0.6);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath();
      ctx.arc(px, py, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    const tail = train.x - dir * train.n * train.gap;
    if ((dir > 0 && tail > W * 1.1) || (dir < 0 && tail < -W * 0.1)) {
      train = null;
      nextTrain = 6000 + Math.random() * 6000;
    }
  }

  let last = 0;
  function frame(now) {
    if (!t0) t0 = now;
    const dt = last ? Math.min(now - last, 50) : 16;
    last = now;
    const time = now - t0;

    ctx.clearRect(0, 0, W, H);
    drawStars(time);

    if (!reduce) {
      if (!train) {
        nextTrain -= dt;
        if (nextTrain <= 0) spawnTrain();
      }
      drawTrain(dt);
    }

    drawPlanet(time);

    if (!reduce) requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { layout(); if (reduce) requestAnimationFrame(frame); }, 120);
  });

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
