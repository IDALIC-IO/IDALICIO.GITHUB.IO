<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IDALIC.IO — Em breve</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap');

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #050505;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,0.08), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(255,255,255,0.06), transparent 32%),
    linear-gradient(to bottom, rgba(255,255,255,0.02), transparent 30%);
  pointer-events: none;
}

/* fundo estrelas */
/* campo de estrelas multi‑camadas */
body::after{
content:"";
position:absolute;
inset:0;
background-image:
radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.9), transparent),
radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.8), transparent),
radial-gradient(1.5px 1.5px at 80% 40%, rgba(255,255,255,0.9), transparent),
radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.7), transparent),
radial-gradient(2px 2px at 90% 80%, rgba(255,255,255,0.9), transparent),
radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.8), transparent),
radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.7), transparent),
radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.9), transparent);
background-size:800px 800px;
background-repeat:repeat;
animation:starsDrift 160s linear infinite;
opacity:0.45;
pointer-events:none
}

/* camada extra para profundidade */
body::before{
content:"";
position:absolute;
inset:0;
background-image:
radial-gradient(1px 1px at 20% 40%, rgba(255,255,255,0.7), transparent),
radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.6), transparent),
radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.7), transparent),
radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.8), transparent);
background-size:600px 600px;
animation:starsDriftSlow 220s linear infinite;
opacity:0.35;
pointer-events:none
}

.wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1280px;
  padding: 32px 24px;
  text-align: center;
}

.stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
  padding: 12px 24px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 14px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: #d4d4d8;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 0 30px rgba(255,255,255,0.03);
  animation: badgeFloat 4s ease-in-out infinite;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: #ef4444;
  box-shadow:
    0 0 10px rgba(239,68,68,0.95),
    0 0 20px rgba(239,68,68,0.55);
  animation: dotPulse 1.6s ease-in-out infinite;
}

.title-box {
  position: relative;
  display: inline-block;
  padding: 84px 0 120px;
}

.ambient-halo {
  position: absolute;
  left: 50%;
  top: 44%;
  width: 760px;
  height: 760px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.07), rgba(255,255,255,0.02) 42%, transparent 68%);
  filter: blur(70px);
  opacity: 0.7;
  animation: haloPulse 6s ease-in-out infinite;
  pointer-events: none;
}

.uplight {
  position: absolute;
  left: 50%;
  bottom: -82px;
  width: 170%;
  height: 280px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.55), rgba(255,255,255,0.18) 38%, transparent 72%);
  filter: blur(50px);
  opacity: 0.82;
  animation: uplightPulse 5.5s ease-in-out infinite;
  pointer-events: none;
}

.light-beam {
  position: absolute;
  left: 50%;
  bottom: -260px;
  width: 320px;
  height: 520px;
  transform: translateX(-50%);
  background: linear-gradient(to top, rgba(255,255,255,0.2), rgba(255,255,255,0.05) 45%, transparent 80%);
  filter: blur(70px);
  opacity: 0.58;
  pointer-events: none;
}

.line {
  position: absolute;
  left: -240px;
  right: -240px;
  top: 50%;
  height: 1px;
  transform: translateY(-50%);
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.52), transparent);
  opacity: 0.95;
}

.line-glow {
  position: absolute;
  left: -160px;
  right: -160px;
  top: 50%;
  height: 3px;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.2);
  filter: blur(14px);
  opacity: 0.72;
}

.scan-wave {
  position: absolute;
  top: 50%;
  left: -340px;
  width: 320px;
  height: 16px;
  transform: translateY(-50%);
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.16), rgba(255,255,255,0.85), rgba(255,255,255,0.16), transparent);
  filter: blur(8px);
  opacity: 0.95;
  animation: laserRun 2.5s linear infinite;
  pointer-events: none;
}

.laser {
  position: absolute;
  top: 50%;
  left: -280px;
  width: 260px;
  height: 4px;
  transform: translateY(-50%);
  background: linear-gradient(to right, transparent, rgba(255,255,255,1), transparent);
  filter: blur(1.2px);
  box-shadow:
    0 0 16px rgba(255,255,255,0.95),
    0 0 36px rgba(255,255,255,0.72),
    0 0 72px rgba(255,255,255,0.38);
  animation: laserRun 2.5s linear infinite;
  pointer-events: none;
}

.laser-core {
  position: absolute;
  inset: 1px 18px;
  background: rgba(255,255,255,0.98);
  border-radius: 999px;
}

.title-glow {
  position: absolute;
  inset: 0;
  filter: blur(24px);
  opacity: 0.4;
  animation: titleGlowPulse 4.5s ease-in-out infinite;
  pointer-events: none;
}

.title-glow::before {
  content: "IDALIC.IO";
  position: absolute;
  inset: 0;
  font-family: "Orbitron", sans-serif;
  font-weight: 700;
  font-size: clamp(3rem, 10vw, 7.5rem);
  letter-spacing: 0.28em;
  color: rgba(255,255,255,0.3);
}

.title-reflection {
  position: absolute;
  left: 50%;
  top: calc(100% + 8px);
  transform: translateX(-50%) scaleY(-1);
  transform-origin: top center;
  font-family: "Orbitron", sans-serif;
  font-size: clamp(2.4rem, 8vw, 6.1rem);
  font-weight: 700;
  letter-spacing: 0.28em;
  color: rgba(255,255,255,0.12);
  white-space: nowrap;
  filter: blur(1px);
  opacity: 0.38;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent 70%);
  pointer-events: none;
}

.title {
  position: relative;
  z-index: 4;
  margin: 0;
  font-size: clamp(3rem, 10vw, 7.5rem);
  font-weight: 700;
  letter-spacing: 0.28em;
  font-family: "Orbitron", sans-serif;
  color: #fff;
  text-shadow:
    0 0 18px rgba(255,255,255,0.22),
    0 0 44px rgba(255,255,255,0.14),
    0 12px 50px rgba(255,255,255,0.06);
  animation: titleReveal 1.15s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.particles,
.particles::before,
.particles::after {
  position: absolute;
  content: "";
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.75);
  box-shadow:
    -240px -10px 0 rgba(255,255,255,0.16),
    -180px 16px 0 rgba(255,255,255,0.12),
    -120px -18px 0 rgba(255,255,255,0.18),
    -60px 10px 0 rgba(255,255,255,0.12),
    40px -14px 0 rgba(255,255,255,0.14),
    120px 12px 0 rgba(255,255,255,0.18),
    200px -8px 0 rgba(255,255,255,0.12),
    260px 10px 0 rgba(255,255,255,0.16);
  transform: translate(-50%, -50%);
  filter: blur(1px);
  opacity: 0.45;
  animation: particlesDrift 7s ease-in-out infinite;
  pointer-events: none;
}

.particles::before {
  width: 4px;
  height: 4px;
  opacity: 0.55;
  animation-duration: 5.8s;
}

.particles::after {
  width: 3px;
  height: 3px;
  opacity: 0.4;
  animation-duration: 8.2s;
}

@keyframes starsDrift{
0%{background-position:0 0}
100%{background-position:2000px 2000px}
}

@keyframes starsDriftSlow{
0%{background-position:0 0}
100%{background-position:-1500px 1500px}
}{
0%{background-position:0 0}
100%{background-position:1000px 1000px}
}

@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

@keyframes dotPulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.35); }
}

@keyframes titleReveal {
  from { opacity: 0; transform: scale(0.98); filter: blur(8px); }
  to { opacity: 1; transform: scale(1); filter: blur(0); }
}

@keyframes laserRun {
  0% { left: -340px; }
  100% { left: calc(100% + 40px); }
}

@keyframes uplightPulse {
  0%, 100% { opacity: 0.62; }
  50% { opacity: 0.95; }
}

@keyframes haloPulse {
  0%, 100% { opacity: 0.48; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.78; transform: translate(-50%, -50%) scale(1.04); }
}

@keyframes titleGlowPulse {
  0%, 100% { opacity: 0.22; }
  50% { opacity: 0.5; }
}

/* estrelas piscando */
@keyframes twinkle{
0%,100%{opacity:.35}
50%{opacity:.9}
}

@keyframes particlesDrift {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); opacity: 0.25; }
  50% { transform: translate(-50%, -50%) translateY(-10px); opacity: 0.52; }
}

@media (max-width: 768px) {
  .badge {
    font-size: 12px;
    letter-spacing: 0.28em;
    padding: 10px 18px;
    gap: 10px;
    margin-bottom: 20px;
  }

  .title-box {
    padding: 60px 0 90px;
  }

  .line {
    left: -80px;
    right: -80px;
  }

  .line-glow {
    left: -40px;
    right: -40px;
  }

  .laser {
    width: 170px;
    left: -190px;
  }

  .scan-wave {
    width: 190px;
    left: -220px;
  }

  .title-reflection {
    top: calc(100% + 4px);
    font-size: clamp(2rem, 7vw, 4rem);
  }

  .uplight {
    width: 190%;
    height: 220px;
  }

  .light-beam {
    width: 240px;
    height: 360px;
  }
}

/* nebulosa espacial */
.nebula{
position:absolute;
left:50%;
top:45%;
width:900px;
height:600px;
transform:translate(-50%,-50%);
background:radial-gradient(circle at 40% 50%, rgba(120,140,255,0.15), transparent 60%),
radial-gradient(circle at 60% 60%, rgba(255,120,200,0.12), transparent 65%),
radial-gradient(circle at 50% 40%, rgba(120,255,220,0.10), transparent 70%);
filter:blur(90px);
opactiy:.6;
pointer-events:none;
animation:nebulaMove 40s ease-in-out infinite alternate;
}

/* estrela cadente */
.shooting-star{
position:absolute;
width:2px;
height:2px;
background:white;
box-shadow:0 0 6px white,0 0 12px white;
top:-10px;
left:-10px;
animation:shoot 12s linear infinite;
}

.shooting-star::after{
content:"";
position:absolute;
width:120px;
height:2px;
background:linear-gradient(to right, white, transparent);
transform:translateX(-120px);
opacity:.7;
}

@keyframes nebulaMove{
0%{transform:translate(-50%,-50%) scale(1)}
100%{transform:translate(-50%,-48%) scale(1.05)}
}

@keyframes shoot{
0%{transform:translate(0,0);opacity:0}
5%{opacity:1}
25%{transform:translate(1200px,400px);opacity:0}
100%{opacity:0}
}

</style>
</head>
<body>
<div class="nebula"></div>
<div class="shooting-star"></div>
<main class="wrap">
  <div class="stack">
    <div class="badge">
      <span class="dot"></span>
      <span>Em breve</span>
    </div>

    <div class="title-box">
      <div class="ambient-halo"></div>
      <div class="uplight"></div>
      <div class="light-beam"></div>
      <div class="particles"></div>

      <div class="line"></div>
      <div class="line-glow"></div>
      <div class="scan-wave"></div>

      <div class="laser">
        <div class="laser-core"></div>
      </div>

      <div class="title-glow"></div>
      <h1 class="title">IDALIC.IO</h1>
      <div class="title-reflection">IDALIC.IO</div>
    </div>
  </div>
</main>
</body>
</html>
