<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>IDALIC.IO — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

<style>
:root {
  color-scheme: dark;
  --black: #000000;
  --white: #ffffff;
  --gold: #d9b77c;
  --alert: #ff3b30;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: "Orbitron", "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.veil {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(130vw, 1200px);
  height: min(40vh, 340px);
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.4) 45%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}

main {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 3.2vh, 30px);
  padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
  text-align: center;
  pointer-events: none;
}

.title {
  position: relative;
  margin: 0;
  font-weight: 700;
  font-size: clamp(2rem, 8.2vw, 6.2rem);
  letter-spacing: 0.2em;
  padding-left: 0.2em;
  line-height: 1;
  white-space: nowrap;
  color: #e8e3d8;
  text-shadow: 0 0 2px rgba(0,0,0,0.7), 0 4px 30px rgba(0,0,0,0.8);
}

/* Letters drop into place one after another */
.title span {
  display: inline-block;
  opacity: 0;
  transform: translateY(-0.5em);
  filter: blur(8px);
  animation: drop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.title span:nth-child(1) { animation-delay: 2.0s; }
.title span:nth-child(2) { animation-delay: 2.09s; }
.title span:nth-child(3) { animation-delay: 2.18s; }
.title span:nth-child(4) { animation-delay: 2.27s; }
.title span:nth-child(5) { animation-delay: 2.36s; }
.title span:nth-child(6) { animation-delay: 2.45s; }
.title span:nth-child(7) { animation-delay: 2.54s; }
.title span:nth-child(8) { animation-delay: 2.63s; }
.title span:nth-child(9) { animation-delay: 2.72s; }

/* A band of golden light sweeps across the name, like sunlight off the rings */
.title::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  padding-left: 0.2em;
  color: transparent;
  text-shadow: none;
  background: linear-gradient(105deg,
    transparent 0%, transparent 42%,
    rgba(255,190,90,0.9) 46%, rgba(255,236,190,1) 49%, #fff 50%, rgba(255,236,190,1) 51%, rgba(255,190,90,0.9) 54%,
    transparent 58%, transparent 100%);
  background-size: 300% 100%;
  background-position: 100% 0;

  -webkit-background-clip: text;
          background-clip: text;
  opacity: 0;
  animation: glint 7s 4s ease-in-out infinite;
  pointer-events: none;
}

/* Soft breathing glow behind the name */
.title::before {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 60%;
  transform: translateY(-50%);
  background: radial-gradient(ellipse at center, rgba(217,183,124,0.22), transparent 70%);
  filter: blur(20px);
  z-index: -1;
  opacity: 0;
  animation: breathe 6s 3.5s ease-in-out infinite;
}

@keyframes drop {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes glint {
  0%   { background-position: 100% 0; opacity: 1; }
  35%  { background-position: 0% 0; opacity: 1; }
  36%, 100% { background-position: 0% 0; opacity: 0; }
}
@keyframes breathe {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-weight: 500;
  font-size: clamp(0.72rem, 1.6vw, 0.9rem);
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  opacity: 0;
  animation: fade 1.2s 3.2s ease forwards;
}

.status::before,
.status::after {
  content: "";
  width: clamp(28px, 6vw, 64px);
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold));
}
.status::after { background: linear-gradient(to left, transparent, var(--gold)); }

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--alert);
  box-shadow: 0 0 10px var(--alert);
  animation: blink 1.6s ease-in-out infinite;
}

@keyframes fade   { to { opacity: 1; } }
@keyframes blink  { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .title span { animation: none; opacity: 1; transform: none; filter: none; }
  .title::after, .title::before { animation: none; opacity: 0; }
  .status { animation: none; opacity: 1; }
  .dot { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<canvas id="saturn" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main>
  <h1 class="title" data-text="IDALIC.IO" aria-label="IDALIC.IO"><span aria-hidden="true">I</span><span aria-hidden="true">D</span><span aria-hidden="true">A</span><span aria-hidden="true">L</span><span aria-hidden="true">I</span><span aria-hidden="true">C</span><span aria-hidden="true">.</span><span aria-hidden="true">I</span><span aria-hidden="true">O</span></h1>
  <div class="status">
    <span class="dot" aria-hidden="true"></span>
    <span>EM BREVE</span>
  </div>
</main>

<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('saturn');
  const ctx = canvas.getContext('2d');

  function rng(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // 1D noise (ring structure, band palette)
  const r1 = rng(9);
  const N1 = Array.from({ length: 512 }, r1);
  function n1(x) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    const a = N1[((i % 512) + 512) % 512], b = N1[(((i + 1) % 512) + 512) % 512];
    return a + (b - a) * u;
  }

  // Tileable 2D value noise (cloud turbulence)
  const r2 = rng(1971);
  const G = 256;
  const lat2 = Array.from({ length: G * G }, r2);
  function vn(x, y, px, py) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const at = (a, b) => lat2[((((b % py) + py) % py) % G) * G + ((((a % px) + px) % px) % G)];
    const A = at(xi, yi), B = at(xi + 1, yi), C = at(xi, yi + 1), D = at(xi + 1, yi + 1);
    return A + (B - A) * u + (C - A) * v + (A - B - C + D) * u * v;
  }
  function fbm(u, v, oct) {
    let s = 0, a = 0.5, f = 1;
    for (let o = 0; o < oct; o++) {
      const px = 6 * f, py = 3 * f;
      s += a * vn(u * px, v * py, px, py);
      a *= 0.5; f *= 2;
    }
    return s;
  }

  /* ---------- Geometry (planet radius = 1) ---------- */
  const ELEV = 0.33;
  const ROLL = -0.32;
  const N = [0, Math.cos(ELEV), Math.sin(ELEV)];
  const E1 = [1, 0, 0];
  const E2 = [0, Math.sin(ELEV), -Math.cos(ELEV)];
  const OBL = 0.91;
  const L = (() => { const v = [0.95, 0.32, 0.12]; const l = Math.hypot(...v); return v.map(c => c / l); })();
  const LN = L[0] * N[0] + L[1] * N[1] + L[2] * N[2];

  const RINGS = [
    [1.24, 1.53, 0.16, 150, 136, 118],
    [1.53, 1.95, 0.92, 232, 214, 176],
    [1.95, 2.03, 0.05, 120, 110, 95],
    [2.03, 2.27, 0.62, 210, 192, 158]
  ];
  function ringAt(r) {
    for (const g of RINGS) {
      if (r >= g[0] && r < g[1]) {
        let op = g[2];
        if (Math.abs(r - 2.214) < 0.006) op *= 0.1;
        op *= 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(r * 140) * Math.sin(r * 43 + 1.3));
        op *= 0.85 + 0.3 * (n1(r * 140) - 0.5);
        op *= smooth(g[0], g[0] + 0.012, r) * (1 - smooth(g[1] - 0.012, g[1], r));
        return [op, g[3], g[4], g[5]];
      }
    }
    return null;
  }

  /* ---------- Cloud texture with storms, so the spin is visible ---------- */
  const TW = 1024, TH = 512;
  const tex = new Uint8ClampedArray(TW * TH * 3);
  const palette = [[226, 206, 160], [214, 182, 126], [196, 156, 98], [238, 226, 194]];
  const storms = [
    { u: 0.18, lat: -0.38, w: 0.035, h: 0.035, c: [246, 238, 220], a: 0.9 },
    { u: 0.52, lat: 0.62, w: 0.06, h: 0.03, c: [250, 244, 230], a: 0.85 },
    { u: 0.77, lat: -0.15, w: 0.025, h: 0.02, c: [150, 110, 70], a: 0.7 },
    { u: 0.36, lat: 0.25, w: 0.045, h: 0.018, c: [244, 232, 205], a: 0.7 },
    { u: 0.9, lat: 0.45, w: 0.03, h: 0.02, c: [170, 128, 82], a: 0.6 }
  ];
  for (let y = 0; y < TH; y++) {
    const v = y / TH;
    const lat = (0.5 - v) * Math.PI;
    for (let x = 0; x < TW; x++) {
      const u = x / TW;
      // Wavy band edges and streaky turbulence along each band
      const warp = (fbm(u, v, 5) - 0.5) * 0.09;
      const lw = lat + warp;
      const pv = n1(lw * 26 + 40) * 0.6 + n1(lw * 70 + 9) * 0.3 + n1(lw * 160) * 0.1;
      const t = pv * (palette.length - 1);
      const i = Math.min(palette.length - 2, Math.floor(t)), f = t - i;
      let c = palette[i].map((q, k) => q + (palette[i + 1][k] - q) * f);
      const streak = 0.9 + 0.2 * fbm(u * 4, v * 0.6 + 0.3, 4);
      c = c.map(q => q * streak);
      // Storms
      for (const s of storms) {
        let du = u - s.u; du -= Math.round(du);
        const k = Math.exp(-((du / s.w) ** 2 + ((lat - s.lat) / s.h) ** 2));
        if (k > 0.01) c = c.map((q, j) => q + (s.c[j] - q) * k * s.a);
      }
      // Polar hexagon and bluish cap in the north
      const pole = smooth(0.95, 1.25, lat);
      c = [c[0] + (140 - c[0]) * pole * 0.55, c[1] + (158 - c[1]) * pole * 0.55, c[2] + (172 - c[2]) * pole * 0.55];
      const j = (y * TW + x) * 3;
      tex[j] = c[0]; tex[j + 1] = c[1]; tex[j + 2] = c[2];
    }
  }

  /* ---------- Layers ---------- */
  let W, H, R, stars = [];
  let back, front;                  // static ring layers (full resolution)
  let pc, pctx, pimg, pIdx, pTy, pLon, pShade, pAlpha, PW, PH;

  function renderRings() {
    const q = Math.min(window.devicePixelRatio || 1, 1.5);
    const SW = Math.round(W * q), SH = Math.round(H * q);
    back = document.createElement('canvas');
    front = document.createElement('canvas');
    back.width = front.width = SW;
    back.height = front.height = SH;
    const bi = back.getContext('2d').createImageData(SW, SH);
    const fi = front.getContext('2d').createImageData(SW, SH);
    const Rp = R * q;
    const cr = Math.cos(-ROLL), sr = Math.sin(-ROLL);

    for (let py = 0; py < SH; py++) {
      for (let px = 0; px < SW; px++) {
        const sx = (px + 0.5 - SW / 2) / Rp;
        const sy = -(py + 0.5 - SH / 2) / Rp;
        const x = sx * cr - sy * sr;
        const y = sx * sr + sy * cr;
        const zr = -(y * N[1]) / N[2];
        const rr = Math.hypot(x, y, zr);
        if (rr < 1.2 || rr > 2.3) continue;
        const rg = ringAt(rr);
        if (!rg || rg[0] < 0.003) continue;

        const ys = y / OBL;
        const dd = x * x + ys * ys;
        const zs = dd < 1 ? Math.sqrt(1 - dd) : -Infinity;
        // Front layer: rings crossing in front of the disk (plus a thin margin past the limb
        // so the planet's soft edge never shows a seam). Everything else goes behind.
        const coversDisk = dd < 1 && zr > zs;
        const nearLimb = zr > 0 && dd >= 1 && dd < 1.03;

        const b = x * L[0] + y * L[1] + zr * L[2];
        const disc = b * b - (rr * rr - 1);
        const lit = disc > 0 && -b - Math.sqrt(disc) > 0 ? 0.04 : 0.95;

        const i = (py * SW + px) * 4;
        const put = (dst, a) => {
          dst[i] = rg[1] * lit; dst[i + 1] = rg[2] * lit; dst[i + 2] = rg[3] * lit; dst[i + 3] = a * 255;
        };
        if (coversDisk) put(fi.data, rg[0]);
        else {
          put(bi.data, rg[0]);
          if (nearLimb) put(fi.data, rg[0] * 0.5);
        }
      }
    }
    back.getContext('2d').putImageData(bi, 0, 0);
    front.getContext('2d').putImageData(fi, 0, 0);
  }

  // Precompute everything about each planet pixel that doesn't change as it spins
  function preparePlanet() {
    const q = Math.min(window.devicePixelRatio || 1, 1.5);
    PW = Math.min(Math.round(2 * R * q), 760);
    PH = Math.round(PW * OBL);
    pc = document.createElement('canvas');
    pc.width = PW; pc.height = PH;
    pctx = pc.getContext('2d');
    pimg = pctx.createImageData(PW, PH);

    const idx = [], ty = [], lon = [], shade = [], alpha = [];
    const aa = 2.2 / PW;
    for (let py = 0; py < PH; py++) {
      for (let px = 0; px < PW; px++) {
        const x = (px + 0.5) / PW * 2 - 1;
        const y = (1 - (py + 0.5) / PH * 2) * OBL;
        const ys = y / OBL;
        const dd = x * x + ys * ys;
        const dist = Math.sqrt(dd);
        if (dist > 1 + aa) continue;
        const cov = Math.min(1, Math.max(0, (1 - dist) / aa + 0.5));
        const zz = Math.sqrt(Math.max(0, 1 - Math.min(1, dd)));
        const n = [x, ys, zz];
        const sl = n[0] * N[0] + n[1] * N[1] + n[2] * N[2];
        const lat = Math.asin(Math.max(-1, Math.min(1, sl)));
        const lo = Math.atan2(n[0] * E1[0] + n[1] * E1[1] + n[2] * E1[2], n[0] * E2[0] + n[1] * E2[1] + n[2] * E2[2]);

        const dot = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
        let light = smooth(-0.12, 0.45, dot) * (0.55 + 0.45 * Math.max(0, dot));
        const t = -sl / LN;
        if (t > 0) {
          const Q = [n[0] + t * L[0], n[1] + t * L[1], n[2] + t * L[2]];
          const rg = ringAt(Math.hypot(Q[0], Q[1], Q[2]));
          if (rg) light *= 1 - rg[0] * 0.85;
        }
        const limb = 0.75 + 0.25 * Math.sqrt(zz);
        const night = 0.025 * Math.max(0, -dot + 0.2);

        idx.push((py * PW + px) * 4);
        ty.push(Math.min(TH - 1, Math.max(0, Math.floor((0.5 - lat / Math.PI) * TH))) * TW);
        lon.push(lo / (Math.PI * 2));
        shade.push(light * limb + night);
        alpha.push(cov * 255);
      }
    }
    pIdx = Int32Array.from(idx);
    pTy = Int32Array.from(ty);
    pLon = Float32Array.from(lon);
    pShade = Float32Array.from(shade);
    pAlpha = Uint8ClampedArray.from(alpha);
  }

  function renderPlanet(rot) {
    const d = pimg.data;
    for (let k = 0; k < pIdx.length; k++) {
      let u = pLon[k] + rot;
      u -= Math.floor(u);
      const j = (pTy[k] + ((u * TW) | 0)) * 3;
      const s = pShade[k];
      const i = pIdx[k];
      d[i] = tex[j] * s;
      d[i + 1] = tex[j + 1] * s;
      d[i + 2] = tex[j + 2] * s;
      d[i + 3] = pAlpha[k];
    }
    pctx.putImageData(pimg, 0, 0);
  }

  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = W < 700 ? W * 0.47 : Math.min(W * 0.3, H * 0.44);

    const r = rng(77);
    stars = Array.from({ length: Math.round((W * H) / 2800) }, () => ({
      x: r() * W, y: r() * H, s: r() < 0.05 ? 1.5 : r() * 1 + 0.3, a: r() * 0.55 + 0.1
    }));
    renderRings();
    preparePlanet();
  }

  let t0 = 0;
  function frame(now) {
    if (!t0) t0 = now;
    const time = reduce ? 99999 : now - t0;

    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // The planet spins (one turn every ~70 s); the camera drifts in and floats
    renderPlanet(reduce ? 0.2 : 0.2 + time / 70000);

    const k = Math.min(1, time / 5000);
    const e = 1 - Math.pow(1 - k, 3);
    const scale = 1.18 - 0.18 * e + (reduce ? 0 : Math.sin(time * 0.00015) * 0.006);
    const drift = reduce ? 0 : Math.sin(time * 0.0001) * 0.006;
    const alpha = reduce ? 1 : Math.min(1, time / 1800);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H / 2);
    ctx.rotate(drift);
    ctx.scale(scale, scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(back, -W / 2, -H / 2, W, H);
    ctx.save();
    ctx.rotate(-ROLL);
    ctx.drawImage(pc, -R, -R * OBL, R * 2, R * 2 * OBL);
    ctx.restore();
    ctx.drawImage(front, -W / 2, -H / 2, W, H);
    ctx.restore();

    if (!reduce) requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { layout(); if (reduce) requestAnimationFrame(frame); }, 200);
  });

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
