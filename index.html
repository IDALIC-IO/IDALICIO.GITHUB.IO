<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>IDALIC.IO — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

<style>
:root {
  color-scheme: dark;
  --black: #000000;
  --white: #ffffff;
  --gold: #f0a860;
  --alert: #ff3b30;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: "Orbitron", "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.veil {
  position: fixed;
  left: 50%;
  top: 37%;
  width: min(130vw, 1200px);
  height: min(40vh, 340px);
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.2) 45%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}

main {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 3.2vh, 30px);
  padding: env(safe-area-inset-top, 0px) 20px calc(26vh + env(safe-area-inset-bottom, 0px));
  text-align: center;
  pointer-events: none;
}

.title {
  position: relative;
  margin: 0;
  font-weight: 700;
  font-size: clamp(2rem, 8.2vw, 6.2rem);
  letter-spacing: 0.2em;
  padding-left: 0.2em;
  line-height: 1;
  white-space: nowrap;
  color: #e8e3d8;
  text-shadow: 0 0 2px rgba(0,0,0,0.7), 0 4px 30px rgba(0,0,0,0.8);
}

/* Letters drop into place one after another */
.title span {
  display: inline-block;
  opacity: 0;
  transform: translateY(-0.5em);
  filter: blur(8px);
  animation: drop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.title span:nth-child(1) { animation-delay: 2.0s; }
.title span:nth-child(2) { animation-delay: 2.09s; }
.title span:nth-child(3) { animation-delay: 2.18s; }
.title span:nth-child(4) { animation-delay: 2.27s; }
.title span:nth-child(5) { animation-delay: 2.36s; }
.title span:nth-child(6) { animation-delay: 2.45s; }
.title span:nth-child(7) { animation-delay: 2.54s; }
.title span:nth-child(8) { animation-delay: 2.63s; }
.title span:nth-child(9) { animation-delay: 2.72s; }

/* A band of golden light sweeps across the name, like sunlight off the rings */
.title::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  padding-left: 0.2em;
  color: transparent;
  text-shadow: none;
  background: linear-gradient(105deg,
    transparent 0%, transparent 42%,
    rgba(255,190,90,0.9) 46%, rgba(255,236,190,1) 49%, #fff 50%, rgba(255,236,190,1) 51%, rgba(255,190,90,0.9) 54%,
    transparent 58%, transparent 100%);
  background-size: 300% 100%;
  background-position: 100% 0;

  -webkit-background-clip: text;
          background-clip: text;
  opacity: 0;
  animation: glint 7s 4s ease-in-out infinite;
  pointer-events: none;
}

/* Soft breathing glow behind the name */
.title::before {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 60%;
  transform: translateY(-50%);
  background: radial-gradient(ellipse at center, rgba(240,150,80,0.25), transparent 70%);
  filter: blur(20px);
  z-index: -1;
  opacity: 0;
  animation: breathe 6s 3.5s ease-in-out infinite;
}

@keyframes drop {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes glint {
  0%   { background-position: 100% 0; opacity: 1; }
  35%  { background-position: 0% 0; opacity: 1; }
  36%, 100% { background-position: 0% 0; opacity: 0; }
}
@keyframes breathe {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-weight: 500;
  font-size: clamp(0.72rem, 1.6vw, 0.9rem);
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  opacity: 0;
  animation: fade 1.2s 3.2s ease forwards;
}

/* Stacked speed stripes beside the status, slanted like a fighter-jet title */
.status::before,
.status::after {
  content: "";
  width: clamp(44px, 9vw, 104px);
  height: 11px;
  transform: skewX(-32deg) scaleX(0);
  animation: stripes 0.9s 3.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.status::before {
  transform-origin: right center;
  background:
    linear-gradient(to left, var(--gold), rgba(240,168,96,0)) right 0 / 100% 2px no-repeat,
    linear-gradient(to left, var(--gold), rgba(240,168,96,0)) right 4.5px / 74% 2px no-repeat,
    linear-gradient(to left, var(--gold), rgba(240,168,96,0)) right 9px / 48% 2px no-repeat;
}
.status::after {
  transform-origin: left center;
  background:
    linear-gradient(to right, var(--gold), rgba(240,168,96,0)) left 0 / 100% 2px no-repeat,
    linear-gradient(to right, var(--gold), rgba(240,168,96,0)) left 4.5px / 74% 2px no-repeat,
    linear-gradient(to right, var(--gold), rgba(240,168,96,0)) left 9px / 48% 2px no-repeat;
}
@keyframes stripes { to { transform: skewX(-32deg) scaleX(1); } }

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--alert);
  box-shadow: 0 0 10px var(--alert);
  animation: blink 1.6s ease-in-out infinite;
}

@keyframes fade   { to { opacity: 1; } }
@keyframes blink  { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .title span { animation: none; opacity: 1; transform: none; filter: none; }
  .title::after, .title::before { animation: none; opacity: 0; }
  .status { animation: none; opacity: 1; }
  .status::before, .status::after { animation: none; transform: skewX(-32deg); }
  .dot { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main>
  <h1 class="title" data-text="IDALIC.IO" aria-label="IDALIC.IO"><span aria-hidden="true">I</span><span aria-hidden="true">D</span><span aria-hidden="true">A</span><span aria-hidden="true">L</span><span aria-hidden="true">I</span><span aria-hidden="true">C</span><span aria-hidden="true">.</span><span aria-hidden="true">I</span><span aria-hidden="true">O</span></h1>
  <div class="status">
    <span class="dot" aria-hidden="true"></span>
    <span>EM BREVE</span>
  </div>
</main>

<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  function rng(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  /* ---------- T-6 Texan seen head-on (1000 × 300, ground at y = 300) ---------- */
  const PLANE = new Path2D(
    // wings with dihedral, rounded tips, joined under the fuselage
    'M30,150 L440,196 L560,196 L970,150 C992,150 992,166 970,166 L560,222 L440,222 L30,166 C8,166 8,150 30,150 Z ' +
    // canopy hump and the fin peeking above it
    'M460,142 C460,96 540,96 540,142 Z ' +
    'M496,142 L497,84 L503,84 L504,142 Z ' +
    // horizontal stabiliser behind, just under the wings
    'M286,204 L714,204 L714,211 L286,211 Z ' +
    // main gear legs
    'M366,200 L378,200 L376,250 L364,250 Z ' +
    'M622,200 L634,200 L636,250 L624,250 Z'
  );
  const BODY = { x: 500, y: 180, rx: 62, ry: 70 };          // fuselage behind the cowling
  const COWL = { x: 500, y: 178, r: 58 };                   // round radial-engine cowling
  const TIRES = [[359, 242, 22, 58], [619, 242, 22, 58]];    // x, y, w, h — seen face-on
  const CANOPY = new Path2D('M466,140 C466,104 534,104 534,140 Z');
  const PROP = { x: 500, y: 178, r: 108 };

  /* ---------- Layout ---------- */
  let W, H, dpr, yh, yT, ox0, ox1, oy0, sunX, sunY, sunR;
  let jet = { s: 1, gx: 0, gy: 0 };
  let skyLayer, hangarLayer, jetLayer, floorLayer;
  let lights = [], dust = [];
  let t0 = 0;
  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

  function layer() {
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, g];
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const mobile = W < 700;
    const M = Math.min(W, H);

    // Measure where the name and status actually sit, then fit the scene around them
    const head = document.querySelector('.title').getBoundingClientRect();
    const tail = document.querySelector('.status').getBoundingClientRect();
    const textTop = head.top || H * 0.3;
    const textBottom = tail.bottom || H * 0.48;

    jet.gy = H * (mobile ? 0.8 : 0.84);                     // where the wheels touch
    const room = Math.max(H * 0.12, jet.gy - textBottom - H * 0.05);
    const pw = Math.min(W * (mobile ? 0.92 : 0.7), room / 0.24, 1000);
    jet.s = pw / 1000;
    jet.gx = W / 2 - 500 * jet.s;

    yh = jet.gy - 64 * jet.s;                                // horizon under the wings
    yT = jet.gy - 6 * jet.s;                                 // hangar door threshold
    ox0 = W * (mobile ? 0.035 : 0.05);
    ox1 = W - ox0;
    oy0 = Math.max(H * 0.03, textTop - H * 0.15);
    sunR = M * 0.035;
    // Sun past the right wingtip if there is room, otherwise glowing under the wing
    const tipRoom = ox1 - (W / 2 + pw / 2);
    sunX = tipRoom > sunR * 4 ? W / 2 + pw / 2 + tipRoom * 0.5 : W / 2 + pw * 0.3;
    sunY = yh + sunR * 0.25;

    buildSky();
    buildHangar();
    buildJet();
    buildFloor();

    // Taxiway lights on the apron, two rows receding
    lights = [];
    const r = rng(5);
    for (const row of [{ y: yh + (yT - yh) * 0.18, gap: 14, s: 1.1 }, { y: yh + (yT - yh) * 0.55, gap: 30, s: 1.8 }]) {
      for (let x = ox0 + 6; x < ox1; x += row.gap * Math.max(1, W / 1440 + 0.4)) {
        lights.push({
          x, y: row.y, s: row.s,
          blue: r() < 0.6,
          ph: r() * 6.28,
          on: 1400 + ((x - ox0) / (ox1 - ox0)) * 1400 + (row.s > 1.5 ? 200 : 0)
        });
      }
    }

    const d = rng(12);
    dust = Array.from({ length: mobile ? 50 : 110 }, () => ({
      x: d() * W, y: oy0 + d() * (H - oy0), z: 0.3 + d() * 0.7,
      vx: (d() - 0.5) * 0.06, vy: -0.02 - d() * 0.05, ph: d() * 6.28
    }));
  }

  /* Sky: sunset glow at the horizon fading to black overhead */
  function buildSky() {
    const [c, g] = layer();
    skyLayer = c;
    const sky = g.createLinearGradient(0, oy0, 0, yh);
    sky.addColorStop(0, '#000000');
    sky.addColorStop(0.3, '#0b0712');
    sky.addColorStop(0.55, '#2a1124');
    sky.addColorStop(0.75, '#6e2a2c');
    sky.addColorStop(0.9, '#c85a2e');
    sky.addColorStop(1, '#f6a24a');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, yh);

    // Sun glow
    const glow = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.55);
    glow.addColorStop(0, 'rgba(255,214,150,0.9)');
    glow.addColorStop(0.05, 'rgba(255,170,90,0.55)');
    glow.addColorStop(0.25, 'rgba(230,100,50,0.16)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, yh);

    // Thin high clouds catching the last light
    const r = rng(21);
    for (let i = 0; i < 9; i++) {
      const cy = yh - (0.08 + r() * 0.3) * (yh - oy0);
      const cw = W * (0.15 + r() * 0.35);
      const cx = ox0 + r() * (ox1 - ox0);
      const ch = 2 + r() * 5;
      const cl = g.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
      const warm = 1 - (yh - cy) / (yh - oy0);
      cl.addColorStop(0, 'rgba(255,140,90,0)');
      cl.addColorStop(0.5, `rgba(255,${120 + warm * 60},${80 + warm * 30},${0.12 + warm * 0.22})`);
      cl.addColorStop(1, 'rgba(255,140,90,0)');
      g.fillStyle = cl;
      g.beginPath();
      g.ellipse(cx, cy, cw / 2, ch, 0, 0, Math.PI * 2);
      g.fill();
    }

    // Sun disc, half set
    g.save();
    g.beginPath();
    g.rect(0, 0, W, yh);
    g.clip();
    g.fillStyle = '#fff4dc';
    g.shadowColor = 'rgba(255,200,120,1)';
    g.shadowBlur = sunR * 1.5;
    g.beginPath();
    g.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    g.fill();
    g.restore();

    // Distant ridge, control tower and hangars on the horizon
    g.fillStyle = '#0a0608';
    g.beginPath();
    g.moveTo(0, yh);
    for (let x = 0; x <= W; x += 8) {
      const h = 6 + 10 * Math.sin(x * 0.004) + 6 * Math.sin(x * 0.013 + 1) + 3 * Math.sin(x * 0.05);
      g.lineTo(x, yh - Math.max(2, h * (Math.min(W, H) / 900)));
    }
    g.lineTo(W, yh);
    g.closePath();
    g.fill();

    const k = Math.min(W, H) / 900;
    const tx = W * 0.24;
    g.fillRect(tx - 4 * k, yh - 70 * k, 8 * k, 70 * k);
    g.beginPath();
    g.moveTo(tx - 16 * k, yh - 70 * k);
    g.lineTo(tx + 16 * k, yh - 70 * k);
    g.lineTo(tx + 12 * k, yh - 86 * k);
    g.lineTo(tx - 12 * k, yh - 86 * k);
    g.closePath();
    g.fill();
    g.fillRect(tx - 1, yh - 98 * k, 2, 12 * k);
    g.fillStyle = 'rgba(255,190,120,0.55)';
    g.fillRect(tx - 11 * k, yh - 83 * k, 22 * k, 6 * k);
    g.fillStyle = '#0a0608';
    for (const [hx, hw, hh] of [[0.36, 60, 16], [0.44, 40, 12], [0.62, 80, 18]]) {
      g.fillRect(W * hx, yh - hh * k, hw * k, hh * k);
    }

    // Wet apron reflecting the sky
    const ap = g.createLinearGradient(0, yh, 0, yT);
    ap.addColorStop(0, 'rgba(230,120,60,0.55)');
    ap.addColorStop(0.35, 'rgba(110,40,30,0.4)');
    ap.addColorStop(1, 'rgba(15,8,10,1)');
    g.fillStyle = '#120a0c';
    g.fillRect(0, yh, W, yT - yh);
    g.fillStyle = ap;
    g.fillRect(0, yh, W, yT - yh);

    // Sun streak on the wet tarmac
    const st = g.createLinearGradient(sunX - W * 0.08, 0, sunX + W * 0.08, 0);
    st.addColorStop(0, 'rgba(255,190,110,0)');
    st.addColorStop(0.5, 'rgba(255,200,130,0.55)');
    st.addColorStop(1, 'rgba(255,190,110,0)');
    g.fillStyle = st;
    g.fillRect(sunX - W * 0.08, yh, W * 0.16, (yT - yh) * 0.8);
  }

  /* Hangar: black walls around the open door, roof truss silhouetted against the sky */
  function buildHangar() {
    const [c, g] = layer();
    hangarLayer = c;
    g.fillStyle = '#030303';
    g.fillRect(0, 0, W, yT);
    g.globalCompositeOperation = 'destination-out';
    g.fillRect(ox0, oy0, ox1 - ox0, yT - oy0);
    g.globalCompositeOperation = 'source-over';

    // Corrugated door panels pushed to the sides, catching faint warm spill
    for (const [a, b] of [[0, ox0], [ox1, W]]) {
      for (let x = a + 6; x < b; x += 7) {
        const near = 1 - Math.min(1, Math.abs(x - (a === 0 ? ox0 : ox1)) / (W * 0.1));
        g.fillStyle = `rgba(255,140,80,${0.05 + near * 0.08})`;
        g.fillRect(x, oy0, 1, yT - oy0);
      }
    }

    // Rim light on the door jambs
    for (const x of [ox0, ox1]) {
      const rim = g.createLinearGradient(0, oy0, 0, yT);
      rim.addColorStop(0, 'rgba(255,150,80,0)');
      rim.addColorStop(1, 'rgba(255,160,90,0.7)');
      g.fillStyle = rim;
      g.fillRect(x - 1, oy0, 2, yT - oy0);
    }

    // Roof truss
    const tb = Math.min(H * 0.07, (textTop0() - oy0) * 0.45);
    g.fillStyle = '#030303';
    g.fillRect(ox0, oy0, ox1 - ox0, H * 0.012);
    g.fillRect(ox0, oy0 + tb, ox1 - ox0, H * 0.008);
    g.strokeStyle = '#030303';
    g.lineWidth = Math.max(2, H * 0.004);
    const bay = Math.max(40, W * 0.045);
    g.beginPath();
    for (let x = ox0, up = true; x < ox1; x += bay, up = !up) {
      g.moveTo(x, up ? oy0 : oy0 + tb);
      g.lineTo(Math.min(ox1, x + bay), up ? oy0 + tb : oy0);
      g.moveTo(x, oy0);
      g.lineTo(x, oy0 + tb);
    }
    g.stroke();

    // Pendant lamps hanging from the truss
    const M = Math.min(W, H);
    for (const fx of [0.3, 0.5, 0.7]) {
      const lx = W * fx, ly = oy0 + tb + H * 0.02;
      g.strokeStyle = '#030303';
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(lx, oy0 + tb); g.lineTo(lx, ly); g.stroke();
      g.fillStyle = '#030303';
      g.beginPath();
      g.moveTo(lx - M * 0.018, ly + M * 0.014);
      g.lineTo(lx + M * 0.018, ly + M * 0.014);
      g.lineTo(lx + M * 0.006, ly);
      g.lineTo(lx - M * 0.006, ly);
      g.closePath();
      g.fill();
      const cone = g.createRadialGradient(lx, ly + M * 0.016, 0, lx, ly + M * 0.016, M * 0.045);
      cone.addColorStop(0, 'rgba(255,200,140,0.4)');
      cone.addColorStop(1, 'rgba(255,200,140,0)');
      g.fillStyle = cone;
      g.beginPath();
      g.arc(lx, ly + M * 0.016, M * 0.045, 0, Math.PI * 2);
      g.fill();
    }
  }

  function textTop0() { return document.querySelector('.title').getBoundingClientRect().top || H * 0.3; }

  function planeTransform(g, mirror, dx = 0, dy = 0) {
    g.translate(jet.gx + dx, jet.gy + dy);
    if (mirror) g.scale(1, -1);
    g.scale(jet.s, jet.s);
    g.translate(0, -300);
  }

  function planeOutline(g) {
    g.fill(PLANE);
    g.beginPath(); g.ellipse(BODY.x, BODY.y, BODY.rx, BODY.ry, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(COWL.x, COWL.y, COWL.r, 0, Math.PI * 2); g.fill();
    for (const [x, y, w, h] of TIRES) {
      g.beginPath();
      g.roundRect ? g.roundRect(x, y, w, h, w / 2) : g.rect(x, y, w, h);
      g.fill();
    }
  }

  function drawJetShape(g, mirror) {
    g.save();
    planeTransform(g, mirror);
    planeOutline(g);
    g.restore();
  }

  function buildJet() {
    const [c, g] = layer();
    jetLayer = c;
    g.fillStyle = '#060506';
    drawJetShape(g, false);

    g.save();
    planeTransform(g, false);

    // Warm rim light where the sunset wraps around the top edges
    g.strokeStyle = 'rgba(255,150,80,0.55)';
    g.lineWidth = 1.4 / jet.s;
    g.save();
    g.beginPath(); g.rect(0, 0, 1000, 172); g.clip();
    g.stroke(PLANE);
    g.beginPath(); g.arc(COWL.x, COWL.y, COWL.r, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.restore();

    // Canopy glass glowing with the sky behind it, with frame and pilot
    const glass = g.createLinearGradient(0, 104, 0, 140);
    glass.addColorStop(0, 'rgba(255,190,130,0.55)');
    glass.addColorStop(1, 'rgba(255,140,80,0.15)');
    g.fillStyle = glass;
    g.fill(CANOPY);
    g.fillStyle = '#060506';
    g.beginPath(); g.ellipse(500, 128, 10, 12, 0, 0, Math.PI * 2); g.fill();
    g.fillRect(488, 134, 24, 8);
    g.strokeStyle = '#060506';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(480, 108); g.lineTo(482, 140);
    g.moveTo(520, 108); g.lineTo(518, 140);
    g.stroke();

    // Cowling: cooling gills ring and the engine face
    g.strokeStyle = 'rgba(255,170,110,0.18)';
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(COWL.x, COWL.y, COWL.r * 0.78, 0, Math.PI * 2); g.stroke();

    // Landing lights in the wing leading edges
    g.shadowColor = 'rgba(255,220,170,1)';
    g.shadowBlur = 14 / jet.s;
    g.fillStyle = 'rgba(255,236,200,0.95)';
    for (const x of [262, 738]) {
      g.beginPath(); g.ellipse(x, 189, 9, 5, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  // Propeller: translucent disc with a spinning two-blade blur
  function drawProp(time, dx, dy) {
    ctx.save();
    planeTransform(ctx, false, dx, dy);
    const { x, y, r } = PROP;
    const disc = ctx.createRadialGradient(x, y, COWL.r * 0.6, x, y, r);
    disc.addColorStop(0, 'rgba(255,190,130,0)');
    disc.addColorStop(0.85, 'rgba(255,190,130,0.08)');
    disc.addColorStop(1, 'rgba(255,200,140,0.22)');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

    const a = reduce ? 0.5 : time * 0.035;
    ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      // Trailing ghosts sell the motion blur
      const ang = a - k * 0.12;
      ctx.strokeStyle = `rgba(6,5,6,${0.5 - k * 0.15})`;
      ctx.lineWidth = 12 - k * 3;
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(ang) * r * 0.97, y - Math.sin(ang) * r * 0.97);
      ctx.lineTo(x + Math.cos(ang) * r * 0.97, y + Math.sin(ang) * r * 0.97);
      ctx.stroke();
    }
    // Spinner
    ctx.fillStyle = '#0b0a0b';
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,170,110,0.5)';
    ctx.lineWidth = 1.2 / jet.s;
    ctx.beginPath(); ctx.arc(x, y, 11, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.restore();
  }

  /* Polished hangar floor reflecting the door, the sunset and the jet */
  function buildFloor() {
    const [c, g] = layer();
    floorLayer = c;
    g.fillStyle = '#050405';
    g.fillRect(0, yT, W, H - yT);

    // Mirror the door view onto the floor, then fade it out with depth and toward the sides
    const [rc, rg] = layer();
    rg.save();
    rg.beginPath();
    rg.rect(ox0, yT, ox1 - ox0, H - yT);
    rg.clip();
    rg.translate(0, yT * 2);
    rg.scale(1, -1);
    rg.drawImage(skyLayer, 0, 0, W, H);
    rg.restore();
    rg.globalCompositeOperation = 'destination-in';
    const fv = rg.createLinearGradient(0, yT, 0, yT + (H - yT) * 0.7);
    fv.addColorStop(0, 'rgba(0,0,0,0.45)');
    fv.addColorStop(1, 'rgba(0,0,0,0)');
    rg.fillStyle = fv;
    rg.fillRect(0, yT, W, H - yT);
    const fh = rg.createLinearGradient(ox0, 0, ox1, 0);
    fh.addColorStop(0, 'rgba(0,0,0,0)');
    fh.addColorStop(0.12, 'rgba(0,0,0,1)');
    fh.addColorStop(0.88, 'rgba(0,0,0,1)');
    fh.addColorStop(1, 'rgba(0,0,0,0)');
    rg.fillStyle = fh;
    rg.fillRect(0, yT, W, H - yT);
    g.save();
    g.filter = 'blur(3px)';
    g.drawImage(rc, 0, 0, W, H);
    g.restore();

    g.save();
    g.globalAlpha = 0.5;
    g.fillStyle = '#000';
    drawJetShape(g, true);
    g.restore();

    // Light spilling in from the door toward the viewer
    const spill = g.createLinearGradient(0, yT, 0, H);
    spill.addColorStop(0, 'rgba(0,0,0,0)');
    spill.addColorStop(0.6, 'rgba(0,0,0,0.75)');
    spill.addColorStop(1, 'rgba(0,0,0,0.95)');
    g.fillStyle = spill;
    g.fillRect(0, yT, W, H - yT);

    const shaft = g.createRadialGradient(sunX, yT, 0, sunX, yT, H * 0.45);
    shaft.addColorStop(0, 'rgba(255,170,100,0.25)');
    shaft.addColorStop(1, 'rgba(255,170,100,0)');
    g.fillStyle = shaft;
    g.fillRect(0, yT, W, H - yT);

  }

  /* ---------- Animated pieces ---------- */
  function drawLights(time) {
    for (const l of lights) {
      if (!reduce && time < l.on) continue;
      const fade = reduce ? 1 : Math.min(1, (time - l.on) / 250);
      const tw = reduce ? 1 : 0.75 + 0.25 * Math.sin(time * 0.004 + l.ph);
      const c = l.blue ? '120,170,255' : '255,190,90';
      ctx.fillStyle = `rgba(${c},${0.25 * fade * tw})`;
      ctx.beginPath(); ctx.arc(l.x, l.y, l.s * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.9 * fade * tw})`;
      ctx.beginPath(); ctx.arc(l.x, l.y, l.s * 0.7, 0, Math.PI * 2); ctx.fill();
    }
  }

  // An aircraft on final approach: landing light growing as it descends toward the horizon
  function drawApproach(time) {
    const period = 26000;
    const k = reduce ? 0.45 : ((time + 4000) % period) / period;
    const x = ox0 + (ox1 - ox0) * (0.18 + k * 0.22);
    const y = oy0 + (yh - oy0) * (0.38 + k * 0.58);
    const a = Math.min(1, k * 6) * (1 - Math.max(0, (k - 0.92) / 0.08));
    const s = 1 + k * 2.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 14 * s);
    g.addColorStop(0, `rgba(255,255,240,${0.95 * a})`);
    g.addColorStop(0.2, `rgba(255,240,210,${0.35 * a})`);
    g.addColorStop(1, 'rgba(255,240,210,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 14 * s, y - 14 * s, 28 * s, 28 * s);
    if (!reduce && Math.sin(time * 0.006) > 0.85) {
      ctx.fillStyle = `rgba(255,60,60,${a})`;
      ctx.beginPath(); ctx.arc(x + 6 * s, y - 2 * s, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawRays(time) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(ox0, oy0, ox1 - ox0, yT - oy0);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    const n = 14;
    for (let i = 0; i < n; i++) {
      const base = (i / n) * Math.PI * 2 + 0.2;
      const a = base + (reduce ? 0 : Math.sin(time * 0.00012 + i) * 0.015);
      const len = Math.max(W, H) * 1.2;
      const w = 0.015 + (i % 3) * 0.008;
      const g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, len);
      const al = 0.014 + 0.008 * Math.sin(i * 2.3 + (reduce ? 0 : time * 0.0004));
      g.addColorStop(0, `rgba(255,170,100,${al})`);
      g.addColorStop(1, 'rgba(255,170,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sunX, sunY);
      ctx.lineTo(sunX + Math.cos(a - w) * len, sunY + Math.sin(a - w) * len);
      ctx.lineTo(sunX + Math.cos(a + w) * len, sunY + Math.sin(a + w) * len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawDust(time) {
    for (const p of dust) {
      if (!reduce) {
        p.x += p.vx * p.z; p.y += p.vy * p.z;
        if (p.y < oy0) { p.y = H; p.x = Math.random() * W; }
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      }
      const near = Math.max(0, 1 - Math.hypot(p.x - sunX, p.y - sunY) / (Math.max(W, H) * 0.7));
      const a = (0.1 + near * 0.5) * p.z * (0.6 + 0.4 * Math.sin(time * 0.002 + p.ph));
      ctx.fillStyle = `rgba(255,200,140,${a})`;
      ctx.fillRect(p.x, p.y, p.z * 1.6, p.z * 1.6);
    }
  }

  function frame(now) {
    if (!t0) t0 = now;
    const time = reduce ? 99999 : now - t0;

    pointer.x += (pointer.tx - pointer.x) * 0.05;
    pointer.y += (pointer.ty - pointer.y) * 0.05;

    // Slow push-in on load
    const k = Math.min(1, time / 4500);
    const scale = 1.07 - 0.07 * (1 - Math.pow(1 - k, 3));
    const fade = reduce ? 1 : Math.min(1, time / 1500);

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(W / 2, H * 0.6);
    ctx.scale(scale, scale);
    ctx.translate(-W / 2, -H * 0.6);

    const px = pointer.x, py = pointer.y;
    ctx.drawImage(skyLayer, -px * 10, -py * 6, W, H);
    ctx.save(); ctx.translate(-px * 10, -py * 6);
    drawApproach(time);
    ctx.restore();
    ctx.save(); ctx.translate(-px * 6, -py * 4);
    drawLights(time);
    ctx.restore();
    ctx.drawImage(floorLayer, 0, 0, W, H);
    ctx.drawImage(hangarLayer, 0, 0, W, H);
    ctx.drawImage(jetLayer, px * 2, py * 1.5, W, H);
    drawProp(time, px * 2, py * 1.5);
    drawRays(time);
    drawDust(time);
    ctx.restore();

    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener('pointermove', e => {
    pointer.tx = e.clientX / W - 0.5;
    pointer.ty = e.clientY / H - 0.5;
  });
  window.addEventListener('pointerleave', () => { pointer.tx = 0; pointer.ty = 0; });

  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { layout(); if (reduce) requestAnimationFrame(frame); }, 150);
  });

  layout();
  requestAnimationFrame(frame);
  // Re-fit once the web font has loaded, since it changes the text block's size
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
})();
</script>

</body>
</html>
