<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IDALIC.IO — Em breve</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap');
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#0a0a0a;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative
}

body::before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at top,rgba(255,255,255,.08),transparent 38%),
radial-gradient(circle at bottom,rgba(255,255,255,.04),transparent 32%);
pointer-events:none
}

body::after{
content:"";
position:absolute;
inset:0;
opacity:.05;
background-image:
linear-gradient(to right,rgba(255,255,255,.15) 1px,transparent 1px),
linear-gradient(to bottom,rgba(255,255,255,.15) 1px,transparent 1px);
background-size:72px 72px;
pointer-events:none
}

.wrap{
position:relative;
z-index:1;
width:100%;
max-width:1200px;
padding:32px 24px;
text-align:center
}

.stack{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.badge{
display:inline-flex;
align-items:center;
gap:12px;
margin-bottom:18px;
padding:12px 24px;
border:1px solid rgba(255,255,255,.1);
border-radius:999px;
background:rgba(255,255,255,.04);
backdrop-filter:blur(12px);
font-size:14px;
letter-spacing:.35em;
text-transform:uppercase;
color:#d4d4d8;
animation:badgeFloat 4s ease-in-out infinite
}

.dot{
width:10px;
height:10px;
border-radius:999px;
background:#ef4444;
box-shadow:0 0 12px rgba(239,68,68,.9);
animation:dotPulse 1.6s ease-in-out infinite
}

.title-box{
position:relative;
display:inline-block;
padding:12px 0
}

.title{
position:relative;
z-index:2;
margin:0;
font-size:clamp(3rem,10vw,7.5rem);
font-weight:600;
letter-spacing:.28em;
font-family:"Orbitron", "Eurostile", "Rajdhani", sans-serif;
text-shadow:0 0 24px rgba(255,255,255,.08);
animation:titleReveal 1.15s cubic-bezier(.22,1,.36,1) both
}

.line{
position:absolute;
left:-160px;
right:-160px;
top:50%;
height:1px;
transform:translateY(-50%);
background:linear-gradient(to right,transparent,rgba(255,255,255,.45),transparent);
opacity:.9
}

.line-glow{
position:absolute;
left:-80px;
right:-80px;
top:50%;
height:2px;
transform:translateY(-50%);
background:rgba(255,255,255,.18);
filter:blur(10px);
opacity:.6
}

/* LASER */
.laser{
position:absolute;
top:50%;
left:-260px;
width:240px;
height:4px;
transform:translateY(-50%);
background:linear-gradient(to right,transparent,rgba(255,255,255,1),transparent);
filter:blur(1.4px);
box-shadow:
0 0 14px rgba(255,255,255,.95),
0 0 28px rgba(255,255,255,.65),
0 0 48px rgba(255,255,255,.35);
animation:laserRun 2.4s linear infinite
}

.laser-core{
position:absolute;
inset:1px 18px;
background:rgba(255,255,255,.95);
border-radius:999px
}

.ambient{
position:absolute;
left:50%;
top:50%;
width:28rem;
height:28rem;
transform:translate(-50%,-50%);
border-radius:50%;
background:rgba(255,255,255,.035);
filter:blur(60px);
animation:ambientPulse 6s ease-in-out infinite
}

@keyframes badgeFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-2px)}
}

@keyframes dotPulse{
0%,100%{opacity:.45;transform:scale(1)}
50%{opacity:1;transform:scale(1.4)}
}

@keyframes titleReveal{
from{opacity:0;transform:scale(.98);filter:blur(8px)}
to{opacity:1;transform:scale(1);filter:blur(0)}
}

/* CORREÇÃO DO LASER: esquerda → direita total */
@keyframes laserRun{
0%{
left:-260px;
transform:translateY(-50%)
}
100%{
left:calc(100% + 20px);
transform:translateY(-50%)
}
}

@keyframes ambientPulse{
0%,100%{opacity:.2;transform:translate(-50%,-50%) scale(1)}
50%{opacity:.32;transform:translate(-50%,-50%) scale(1.08)}
}

@media (max-width:768px){
.badge{
font-size:12px;
letter-spacing:.28em;
padding:10px 18px;
gap:10px;
margin-bottom:28px
}

.line{left:-60px;right:-60px}
.line-glow{left:-30px;right:-30px}

.laser{
width:160px;
left:-180px
}
}
</style>
</head>

<body>

<div class="ambient"></div>

<main class="wrap">
<div class="stack">

<div class="badge">
<span class="dot"></span>
<span>Em breve</span>
</div>

<div class="title-box">
<div class="line"></div>
<div class="line-glow"></div>

<div class="laser">
<div class="laser-core"></div>
</div>

<h1 class="title">IDALIC.IO</h1>
</div>

</div>
</main>

</body>
</html>
